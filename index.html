<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>엘리 포트폴리오 — 경영학과 2학년</title>
    <meta
      name="description"
      content="경영학과 2학년 엘리의 포트폴리오입니다. AI 파운데이션 구축과 UX/UI 디자인 작업을 3분 안에 살펴보실 수 있습니다."
    />
    <meta property="og:title" content="엘리 포트폴리오 — 경영학과 2학년" />
    <meta
      property="og:description"
      content="경영학과 2학년 엘리의 포트폴리오입니다. AI 파운데이션 구축과 UX/UI 디자인 작업을 3분 안에 살펴보실 수 있습니다."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <style>
      :root {
        --bg-canvas: #ffffff;
        --bg-surface: #f8fafc;
        --bg-surface-hover: #f1f5f9;
        --bg-accent-tint: #eef2ff;
        --ink-primary: #0f172a;
        --ink-secondary: #475569;
        --ink-muted: #64748b;
        --border-hairline: #e2e8f0;
        --border-strong: #cbd5e1;
        --accent: #6366f1;
        --accent-hover: #4f46e5;
        --accent-ink: #4338ca;
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --container-max: 1180px;
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        --shadow-subtle: 0 1px 2px rgba(15, 23, 42, 0.04);
        --shadow-card: 0 10px 30px -12px rgba(15, 23, 42, 0.08);
        --shadow-modal: 0 24px 60px -16px rgba(15, 23, 42, 0.18);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      body {
        margin: 0;
        background-color: var(--bg-canvas);
        color: var(--ink-primary);
        font-family: "Pretendard", "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont,
          "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        font-size: 16px;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      body.modal-open {
        overflow: hidden;
      }

      h1,
      h2,
      h3,
      h4,
      p,
      ul,
      ol {
        margin: 0;
      }

      ul,
      ol {
        padding: 0;
        list-style: none;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        background: none;
        padding: 0;
        color: inherit;
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .skip-link {
        position: absolute;
        left: 16px;
        top: -64px;
        z-index: 100;
        padding: 10px 16px;
        border-radius: var(--radius-sm);
        background-color: var(--ink-primary);
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        transition: top 150ms var(--ease-out);
      }

      .skip-link:focus {
        top: 16px;
      }

      .container {
        width: 100%;
        max-width: var(--container-max);
        margin-left: auto;
        margin-right: auto;
        padding-left: 24px;
        padding-right: 24px;
      }

      @media (min-width: 768px) {
        .container {
          padding-left: 32px;
          padding-right: 32px;
        }
      }

      .font-display {
        font-family: "Plus Jakarta Sans", "Pretendard", sans-serif;
        letter-spacing: -0.025em;
      }

      .font-mono {
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        font-variant-numeric: tabular-nums;
      }

      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }

      /* ----------------------------------------------------------
         Top Navigation (3-Zone Contract)
         ---------------------------------------------------------- */
      .site-header {
        position: sticky;
        top: 0;
        z-index: 40;
        background-color: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border-hairline);
      }

      .header-inner {
        height: 68px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 32px;
      }

      .brand-wordmark {
        font-family: "Plus Jakarta Sans", "Pretendard", sans-serif;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--ink-primary);
        white-space: nowrap;
        flex-shrink: 0;
      }

      .brand-wordmark span {
        color: var(--accent);
      }

      .nav-links {
        display: none;
        align-items: center;
        gap: 32px;
      }

      section[id] {
        scroll-margin-top: 84px;
      }

      .nav-link {
        position: relative;
        font-size: 14px;
        font-weight: 500;
        color: var(--ink-secondary);
        white-space: nowrap;
        flex-shrink: 0;
        padding: 6px 0;
        transition: color 150ms var(--ease-out);
      }

      .nav-link::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 2px;
        background-color: var(--accent);
        transform: scaleX(0);
        transform-origin: left center;
        transition: transform 180ms var(--ease-out);
      }

      .nav-link:hover {
        color: var(--ink-primary);
      }

      .nav-link.is-active {
        color: var(--accent);
        font-weight: 600;
      }

      .nav-link.is-active::after,
      .nav-link:hover::after {
        transform: scaleX(1);
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
      }

      .btn-header-cta {
        display: none;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        padding: 8px 18px;
        border-radius: var(--radius-sm);
        background-color: var(--accent);
        color: #ffffff;
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background-color 150ms var(--ease-out), transform 150ms var(--ease-out);
      }

      .btn-header-cta:hover {
        background-color: var(--accent-hover);
      }

      .btn-header-cta:active {
        transform: scale(0.98);
      }

      .mobile-menu-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-hairline);
        color: var(--ink-primary);
        font-size: 20px;
        line-height: 1;
      }

      .mobile-drawer {
        display: none;
        border-top: 1px solid var(--border-hairline);
        background-color: var(--bg-canvas);
        padding: 12px 24px 20px;
      }

      .mobile-drawer.is-open {
        display: block;
      }

      .mobile-drawer-nav {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .mobile-drawer-link {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 46px;
        padding: 10px 4px;
        font-size: 16px;
        font-weight: 500;
        color: var(--ink-secondary);
        border-bottom: 1px solid var(--border-hairline);
        transition: color 150ms var(--ease-out);
      }

      .mobile-drawer-link.is-active {
        color: var(--accent);
        font-weight: 700;
      }

      .mobile-drawer-link:last-child {
        border-bottom: none;
      }

      @media (min-width: 768px) {
        .nav-links,
        .btn-header-cta {
          display: inline-flex;
        }
        .mobile-menu-btn,
        .mobile-drawer {
          display: none !important;
        }
      }

      /* ----------------------------------------------------------
         Hero Section (Split-Screen Editorial + Summary Strip)
         ---------------------------------------------------------- */
      .hero-section {
        padding-top: 56px;
        padding-bottom: 72px;
        border-bottom: 1px solid var(--border-hairline);
      }

      @media (min-width: 1024px) {
        .hero-section {
          padding-top: 84px;
          padding-bottom: 88px;
        }
      }

      .hero-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 40px;
        align-items: stretch;
      }

      @media (min-width: 1024px) {
        .hero-grid {
          grid-template-columns: minmax(0, 1.25fr) minmax(0, 0.9fr);
          gap: 64px;
        }
      }

      .hero-content {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .hero-kicker {
        font-size: 14px;
        font-weight: 600;
        color: var(--accent-ink);
        margin-bottom: 16px;
      }

      .hero-title {
        font-family: "Pretendard", "Plus Jakarta Sans", sans-serif;
        font-size: clamp(2.125rem, 3.8vw, 3.25rem);
        font-weight: 700;
        line-height: 1.22;
        letter-spacing: -0.03em;
        color: var(--ink-primary);
        text-wrap: balance;
        margin-bottom: 20px;
      }

      .hero-title .accent-word {
        color: var(--accent);
      }

      .hero-subtitle {
        font-size: 17px;
        line-height: 1.7;
        color: var(--ink-secondary);
        max-width: 58ch;
        margin-bottom: 32px;
      }

      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
      }

      .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 46px;
        padding: 12px 24px;
        border-radius: var(--radius-sm);
        background-color: var(--accent);
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background-color 150ms var(--ease-out), transform 150ms var(--ease-out);
      }

      .btn-primary:hover {
        background-color: var(--accent-hover);
      }

      .btn-primary:active {
        transform: scale(0.98);
      }

      .btn-secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 46px;
        padding: 12px 24px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-strong);
        background-color: var(--bg-canvas);
        color: var(--ink-primary);
        font-size: 15px;
        font-weight: 600;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background-color 150ms var(--ease-out), border-color 150ms var(--ease-out),
          transform 150ms var(--ease-out);
      }

      .btn-secondary:hover {
        background-color: var(--bg-surface);
        border-color: var(--ink-secondary);
      }

      .btn-secondary:active {
        transform: scale(0.98);
      }

      /* Hero Profile Visual Frame (Circular Photo / Emoji Avatar)
         Mobile (<1024px): order -1 so photo appears ABOVE hero text */
      .hero-visual {
        order: -1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        border: 1px solid var(--border-hairline);
        border-radius: var(--radius-lg);
        background-color: var(--bg-surface);
        padding: 24px;
        min-height: 300px;
      }

      @media (min-width: 1024px) {
        .hero-visual {
          order: 0;
          min-height: 320px;
        }
      }

      .profile-artwork-frame {
        position: relative;
        width: 100%;
        flex: 1;
        min-height: 248px;
        border-radius: var(--radius-md);
        background-color: var(--bg-canvas);
        border: 1px solid var(--border-hairline);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 28px 20px;
      }

      .profile-circle {
        width: 168px;
        height: 168px;
        border-radius: 50%;
        background-color: var(--bg-accent-tint);
        border: 2px solid #c7d2fe;
        box-shadow: 0 0 0 8px rgba(99, 102, 241, 0.08);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .profile-photo {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .profile-emoji {
        font-size: 72px;
        line-height: 1;
        user-select: none;
      }

      .profile-motto-caption {
        font-size: 13px;
        font-weight: 500;
        color: var(--ink-secondary);
        text-align: center;
      }

      .profile-caption-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding-top: 16px;
        font-size: 13px;
        color: var(--ink-secondary);
      }

      .profile-caption-title {
        font-weight: 600;
        color: var(--ink-primary);
      }

      /* Full-width 3-Minute Summary Strip below Hero Split */
      .summary-strip {
        margin-top: 48px;
        padding-top: 32px;
        border-top: 1px solid var(--border-hairline);
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
      }

      @media (min-width: 768px) {
        .summary-strip {
          margin-top: 64px;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 32px;
        }
      }

      .summary-item-label {
        font-size: 12px;
        font-weight: 500;
        color: var(--ink-muted);
        margin-bottom: 6px;
      }

      .summary-item-value {
        font-size: 15px;
        font-weight: 600;
        color: var(--ink-primary);
        line-height: 1.5;
      }

      /* ----------------------------------------------------------
         Shared Section Framing
         ---------------------------------------------------------- */
      .section {
        padding-top: 80px;
        padding-bottom: 80px;
        border-bottom: 1px solid var(--border-hairline);
      }

      @media (min-width: 1024px) {
        .section {
          padding-top: 96px;
          padding-bottom: 96px;
        }
      }

      .section-header {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 40px;
      }

      .section-eyebrow {
        font-size: 13px;
        font-weight: 600;
        color: var(--accent-ink);
      }

      .section-title {
        font-size: clamp(1.5rem, 2.6vw, 2.125rem);
        font-weight: 700;
        line-height: 1.3;
        letter-spacing: -0.02em;
        color: var(--ink-primary);
        text-wrap: balance;
      }

      .section-lead {
        font-size: 16px;
        color: var(--ink-secondary);
        max-width: 62ch;
      }

      /* ----------------------------------------------------------
         About Section (Left: 3-4 Line Intro / Right: Tag Chips)
         ---------------------------------------------------------- */
      .about-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 36px;
      }

      @media (min-width: 1024px) {
        .about-grid {
          grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.95fr);
          gap: 56px;
          align-items: start;
        }
      }

      .about-intro-col {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .about-quote {
        font-size: 20px;
        font-weight: 700;
        line-height: 1.45;
        letter-spacing: -0.02em;
        color: var(--ink-primary);
      }

      .about-quote span {
        color: var(--accent);
      }

      .about-bio-text {
        font-size: 16px;
        line-height: 1.8;
        color: var(--ink-secondary);
        max-width: 58ch;
      }

      .about-meta-inline {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding-top: 8px;
        font-size: 14px;
        font-weight: 500;
        color: var(--ink-muted);
      }

      .about-meta-inline strong {
        color: var(--ink-primary);
        font-weight: 600;
      }

      .about-tags-panel {
        background-color: var(--bg-surface);
        border: 1px solid var(--border-hairline);
        border-radius: var(--radius-lg);
        padding: 28px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .chip-group-label {
        font-size: 13px;
        font-weight: 600;
        color: var(--ink-muted);
        margin-bottom: 12px;
      }

      .chip-list {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .chip-item {
        display: inline-flex;
        align-items: center;
        min-height: 36px;
        padding: 6px 14px;
        border-radius: 9999px;
        background-color: var(--bg-canvas);
        border: 1px solid var(--border-hairline);
        font-size: 13.5px;
        font-weight: 500;
        color: var(--ink-primary);
        white-space: nowrap;
        transition: border-color 150ms var(--ease-out), background-color 150ms var(--ease-out);
      }

      .chip-item:hover {
        border-color: var(--border-strong);
      }

      .chip-item--accent {
        background-color: var(--bg-accent-tint);
        border-color: #c7d2fe;
        color: var(--accent-ink);
        font-weight: 600;
      }

      .chip-item--accent:hover {
        border-color: var(--accent);
      }

      /* ----------------------------------------------------------
         Works Section (Filter Bar Above + 4-Column Row Grid)
         ---------------------------------------------------------- */
      .works-header {
        margin-bottom: 28px;
      }

      .works-header .section-header {
        margin-bottom: 0;
      }

      .filter-bar {
        display: inline-flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px;
        padding: 4px;
        background-color: var(--bg-surface);
        border: 1px solid var(--border-hairline);
        border-radius: var(--radius-sm);
        margin-bottom: 28px;
      }

      .filter-btn {
        min-height: 38px;
        padding: 7px 16px;
        border-radius: 6px;
        font-size: 13.5px;
        font-weight: 500;
        color: var(--ink-secondary);
        white-space: nowrap;
        flex-shrink: 0;
        transition: background-color 150ms var(--ease-out), color 150ms var(--ease-out),
          box-shadow 150ms var(--ease-out);
      }

      .filter-btn:hover {
        color: var(--ink-primary);
      }

      .filter-btn[aria-pressed="true"] {
        background-color: var(--bg-canvas);
        color: var(--accent-ink);
        font-weight: 600;
        box-shadow: var(--shadow-subtle);
      }

      .projects-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
      }

      @media (min-width: 640px) {
        .projects-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (min-width: 1024px) {
        .projects-grid {
          grid-template-columns: repeat(4, minmax(0, 1fr));
          gap: 20px;
        }
      }

      .project-card {
        display: flex;
        flex-direction: column;
        background-color: var(--bg-canvas);
        border: 1px solid var(--border-hairline);
        border-radius: var(--radius-md);
        padding: 18px;
        transition: transform 180ms var(--ease-out), border-color 180ms var(--ease-out),
          box-shadow 180ms var(--ease-out);
      }

      .project-card:hover {
        transform: translateY(-2px);
        border-color: var(--border-strong);
        box-shadow: var(--shadow-card);
      }

      .project-thumb {
        width: 100%;
        aspect-ratio: 16 / 10;
        border-radius: var(--radius-sm);
        border: 1px solid rgba(15, 23, 42, 0.06);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 16px;
        cursor: pointer;
        user-select: none;
        transition: transform 180ms var(--ease-out);
      }

      .project-thumb-emoji {
        font-size: 46px;
        line-height: 1;
        transition: transform 180ms var(--ease-out);
      }

      .project-card:hover .project-thumb-emoji {
        transform: scale(1.06);
      }

      .project-meta-line {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 500;
        color: var(--ink-muted);
        margin-bottom: 6px;
      }

      .project-meta-category {
        color: var(--accent-ink);
        font-weight: 600;
      }

      .project-title-btn {
        text-align: left;
        font-size: 17px;
        font-weight: 700;
        line-height: 1.4;
        letter-spacing: -0.015em;
        color: var(--ink-primary);
        margin-bottom: 8px;
        transition: color 150ms var(--ease-out);
      }

      .project-card:hover .project-title-btn {
        color: var(--accent);
      }

      .project-desc {
        font-size: 14px;
        line-height: 1.6;
        color: var(--ink-secondary);
        margin-bottom: 14px;
        flex: 1;
      }

      .project-tech-line {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 12px;
        color: var(--ink-muted);
        line-height: 1.5;
        padding-top: 12px;
        border-top: 1px solid var(--border-hairline);
        margin-bottom: 12px;
      }

      .project-footer-links {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .project-site-link {
        display: inline-flex;
        align-items: center;
        gap: 4px;

        gap: 40px;

        display: flex;
        flex-direction: column;
        gap: 16px;

        font-weight: 600;
        color: var(--ink-muted);
        margin-bottom: 4px;

        font-size: 16px;
        font-weight: 600;
        color: var(--ink-primary);

        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }

        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 40px;
        padding: 8px 14px;

        font-size: 13.5px;
        font-weight: 600;
        white-space: nowrap;
        flex-shrink: 0;

        background-color: var(--accent);
        color: #ffffff;
      }

      .btn-compact-primary:hover {
        background-color: var(--accent-hover);
      }

      .btn-compact-outline {
        background-color: var(--bg-canvas);
        border: 1px solid var(--border-strong);
        color: var(--ink-primary);
      }

      .btn-compact-outline:hover {
        background-color: var(--bg-surface-hover);
      }

         Footer
         ---------------------------------------------------------- */
      .site-footer {
        border-top: 1px solid var(--border-hairline);
        background-color: var(--bg-canvas);
        padding: 28px 0;
      }

      .footer-inner {
        display: flex;
        flex-direction: column;
        gap: 12px;
        font-size: 13.5px;
        color: var(--ink-muted);

          flex-direction: row;
          align-items: center;
          justify-content: space-between;
        }

        color: var(--ink-secondary);
        transition: color 150ms var(--ease-out);
      }

      .footer-top-link:hover {
        color: var(--accent);
      }

      /* ----------------------------------------------------------
         Project Detail Modal
         ---------------------------------------------------------- */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background-color: rgba(15, 23, 42, 0.52);
        backdrop-filter: blur(4px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms var(--ease-out);
      }

      .modal-backdrop.is-open {
        opacity: 1;
        pointer-events: auto;
      }

      .modal-dialog {
        width: 100%;
        max-width: 720px;
        max-height: calc(100vh - 32px);
        overflow-y: auto;
        background-color: var(--bg-canvas);
        border: 1px solid var(--border-hairline);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-modal);
        padding: 24px;
        transform: translateY(8px);
        transition: transform 200ms var(--ease-out);

          padding: 36px;

        transform: translateY(0);

        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;

        height: 40px;

        color: var(--ink-primary);
      }

        width: 100%;
        aspect-ratio: 16 / 7;
        border-radius: var(--radius-sm);
        border: 1px solid rgba(15, 23, 42, 0.06);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
      }

      .modal-visual-emoji {
        font-size: 64px;
        line-height: 1;
      }

      .modal-facts {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
        padding: 16px 0;
        border-top: 1px solid var(--border-hairline);
        border-bottom: 1px solid var(--border-hairline);
        margin-bottom: 24px;
      }

      @media (min-width: 640px) {
        .modal-facts {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 20px;
        }
      }

      .modal-fact-label {
        font-size: 12px;
        font-weight: 600;
        color: var(--ink-muted);
        margin-bottom: 4px;
      }

      .modal-fact-value {
        font-size: 14px;
        font-weight: 600;
        color: var(--ink-primary);
      }

      .modal-blocks {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-bottom: 28px;
      }

      .modal-block-title {
        font-size: 14px;
        font-weight: 700;
        color: var(--ink-primary);
        margin-bottom: 6px;
      }

      .modal-block-text {
        font-size: 15px;
        line-height: 1.7;
        color: var(--ink-secondary);
      }

      .modal-footer {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding-top: 20px;
        border-top: 1px solid var(--border-hairline);
      }

      .modal-tech-text {
        font-size: 13px;
        color: var(--ink-muted);
      }

      /* ----------------------------------------------------------
         Toast Notification
         ---------------------------------------------------------- */
      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        z-index: 80;
        transform: translate(-50%, 16px);

        pointer-events: none;

        color: #ffffff;
        font-size: 13.5px;
        font-weight: 500;
        box-shadow: var(--shadow-card);
        transition: opacity 180ms var(--ease-out), transform 180ms var(--ease-out);

      /* ----------------------------------------------------------
         State & DOM Initialization
         ---------------------------------------------------------- */
      const state = {
        activeCategory: "all",
        selectedProjectId: null,
        lastFocusedElement: null,
        toastTimer: null
      };

      function renderProfileAvatar(profile) {
        const slot = document.getElementById("profile-circle-slot");
        const renderEmojiFallback = () => {
          slot.innerHTML = `<span class="profile-emoji" role="img" aria-label="${profile.name} 프로필 이모지">${profile.profileEmoji}</span>`;
        };

        if (profile.profileImageUrl && profile.profileImageUrl.trim() !== "") {
          const img = document.createElement("img");
          img.src = profile.profileImageUrl;
          img.alt = `${profile.name} 프로필 사진`;
          img.className = "profile-photo";
          img.referrerPolicy = "no-referrer";
          img.addEventListener("error", renderEmojiFallback);
          slot.innerHTML = "";
          slot.appendChild(img);
        } else {
          renderEmojiFallback();
        }
      }

      function renderStaticContent() {
        const { profile } = PORTFOLIO_DATA;

        document.getElementById("brand-name").innerHTML = `${profile.brand}<span>.</span>`;
        document.getElementById("hero-greeting").textContent = profile.greeting;
        document.getElementById("hero-headline").innerHTML = profile.headlineHtml;
        document.getElementById("hero-intro").textContent = profile.intro;
        document.getElementById("profile-motto-caption").textContent = profile.experienceHeadline;
        document.getElementById("profile-caption-name").textContent = profile.name;
        document.getElementById("profile-caption-meta").textContent = profile.captionMeta;

        renderProfileAvatar(profile);

        // 3분 핵심 요약 스트립
        const summaryStrip = document.getElementById("summary-strip");
        summaryStrip.innerHTML = profile.summaryHighlights
          .map(
            (item) => `
            <div>
              <p class="summary-item-label">${item.label}</p>
              <p class="summary-item-value tabular-nums">${item.value}</p>
            </div>
          `
          )
          .join("");

        // 자기소개 (왼쪽: 3~4줄 소개글)
        document.getElementById("about-intro-col").innerHTML = `
          <p class="about-quote">${profile.experienceHeadline}</p>
          <p class="about-bio-text">${profile.aboutBio}</p>
          <p class="about-meta-inline">
            <strong>${profile.name}</strong>
            <span aria-hidden="true">·</span>
            <span>${profile.departmentYear}</span>
          </p>
        `;

        // 자기소개 (오른쪽: 관심분야 · 역량 태그 칩)
        document.getElementById("about-tags-col").innerHTML = `
          <div>
            <p class="chip-group-label">관심 분야</p>
            <ul class="chip-list">
              ${profile.interestChips
                .map((tag) => `<li class="chip-item chip-item--accent">${tag}</li>`)
                .join("")}
            </ul>
          </div>
          <div>
            <p class="chip-group-label">보유 역량</p>
            <ul class="chip-list">
              ${profile.competencyChips
                .map((tag) => `<li class="chip-item">${tag}</li>`)
                .join("")}
            </ul>
          </div>
        `;

        // 연락처 섹션
        document.getElementById("contact-note").textContent = profile.contactNote;
        document.getElementById("contact-methods").innerHTML = `
          <div class="contact-card">
            <div>
              <p class="contact-card-label">이메일</p>
              <p class="contact-card-value font-mono">${profile.email}</p>
            </div>
            <div class="contact-card-actions">
              <button type="button" class="btn-compact btn-compact-outline" id="copy-email-btn">
                이메일 복사
              </button>
              <a href="mailto:${profile.email}" class="btn-compact btn-compact-primary">
                메일 보내기
              </a>
            </div>
          </div>

          <div class="contact-card">
            <div>
              <p class="contact-card-label">GitHub</p>
              <p class="contact-card-value font-mono">${profile.githubHandle}</p>
            </div>
            <div class="contact-card-actions">
              <a
                href="${profile.githubUrl}"
                target="_blank"
                rel="noopener noreferrer"
                class="btn-compact btn-compact-outline"
              >
                프로필 방문 ↗
              </a>
            </div>
          </div>
        `;

        document.getElementById("copy-email-btn").addEventListener("click", copyEmailToClipboard);
        document.getElementById("footer-copyright").textContent = profile.copyright;
      }

      function renderFilterBar() {
        const filterBar = document.getElementById("filter-bar");
        filterBar.innerHTML = PORTFOLIO_DATA.categories
          .map((cat) => {
            const isPressed = state.activeCategory === cat.id;
            return `
              <button
                type="button"
                class="filter-btn"
                data-category="${cat.id}"
                aria-pressed="${isPressed}"
              >
                ${cat.label}
              </button>
            `;
          })
          .join("");

        filterBar.querySelectorAll(".filter-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            state.activeCategory = btn.getAttribute("data-category");
            renderFilterBar();
            renderProjects();
          });
        });
      }

      function renderProjects() {
        const grid = document.getElementById("projects-grid");
        const filtered =
          state.activeCategory === "all"
            ? PORTFOLIO_DATA.projects
            : PORTFOLIO_DATA.projects.filter((p) => p.category === state.activeCategory);

        if (filtered.length === 0) {
          grid.innerHTML = `
            <div class="empty-filter-state" style="grid-column: 1 / -1">
              선택한 분야의 프로젝트가 아직 등록되지 않았습니다.
            </div>
          `;
          return;
        }

        grid.innerHTML = filtered
          .map((project) => {
            const techLine = project.tech.join(" · ");

            return `
              <article class="project-card" data-project-id="${project.id}">
                <div
                  class="project-thumb"
                  style="background-color: ${project.thumbBg};"
                  data-open-modal="${project.id}"
                  role="button"
                  tabindex="0"
                  aria-label="${project.title} 상세 보기"
                >
                  <span class="project-thumb-emoji" aria-hidden="true">${project.emoji}</span>
                </div>
                <p class="project-meta-line">
                  <span class="project-meta-category">${project.categoryLabel}</span>
                  <span aria-hidden="true">·</span>
                  <span class="font-mono">${project.year}</span>
                </p>
                <button type="button" class="project-title-btn" data-open-modal="${project.id}">
                  ${project.title}
                </button>
                <p class="project-desc">${project.summary}</p>
                <p class="project-tech-line">${techLine}</p>
                <div class="project-footer-links">
                  <a
                    href="${project.siteUrl}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="project-site-link"
                  >
                    사이트 보기 →
                  </a>
                  <button type="button" class="project-detail-trigger" data-open-modal="${project.id}">
                    상세 설명
                  </button>
                </div>
              </article>
            `;
          })
          .join("");

        grid.querySelectorAll("[data-open-modal]").forEach((trigger) => {
          trigger.addEventListener("click", (event) => {
            const projectId = trigger.getAttribute("data-open-modal");
            openProjectModal(projectId, event.currentTarget);
          });
          if (trigger.getAttribute("role") === "button") {
            trigger.addEventListener("keydown", (event) => {
              if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                openProjectModal(trigger.getAttribute("data-open-modal"), event.currentTarget);
              }
            });
          }
        });
      }

      /* ----------------------------------------------------------
         Modal Interactions
         ---------------------------------------------------------- */
      function openProjectModal(projectId, triggerElement) {
        const project = PORTFOLIO_DATA.projects.find((p) => p.id === projectId);
        if (!project) return;

        state.selectedProjectId = projectId;
        state.lastFocusedElement = triggerElement || document.activeElement;

        const modal = document.getElementById("project-modal");
        document.getElementById("modal-meta").innerHTML = `
          <span class="project-meta-category">${project.categoryLabel}</span>
          <span aria-hidden="true">·</span>
          <span class="font-mono">${project.year}</span>
        `;
        document.getElementById("modal-title").textContent = project.title;

        const modalVisual = document.getElementById("modal-visual");
        modalVisual.style.backgroundColor = project.thumbBg;
        modalVisual.innerHTML = `<span class="modal-visual-emoji" aria-hidden="true">${project.emoji}</span>`;

        document.getElementById("modal-facts").innerHTML = `
          <div>
            <p class="modal-fact-label">담당 역할</p>
            <p class="modal-fact-value">${project.role}</p>
          </div>
          <div>
            <p class="modal-fact-label">진행 기간</p>
            <p class="modal-fact-value font-mono">${project.duration}</p>
          </div>
          <div>
            <p class="modal-fact-label">분류</p>
            <p class="modal-fact-value">${project.categoryLabel}</p>
          </div>
        `;

        document.getElementById("modal-blocks").innerHTML = `
          <div>
            <h4 class="modal-block-title">문제 배경</h4>
            <p class="modal-block-text">${project.problem}</p>
          </div>
          <div>
            <h4 class="modal-block-title">설계 및 구현</h4>
            <p class="modal-block-text">${project.solution}</p>
          </div>
          <div>
            <h4 class="modal-block-title">성과 및 배운 점</h4>
            <p class="modal-block-text">${project.outcome}</p>
          </div>
        `;

        document.getElementById("modal-tech").textContent = project.tech.join(" · ");

        document.getElementById("modal-links").innerHTML = `
          <a href="${project.githubUrl}" target="_blank" rel="noopener noreferrer" class="btn-compact btn-compact-outline">
            GitHub ↗
          </a>
          <a href="${project.siteUrl}" target="_blank" rel="noopener noreferrer" class="btn-compact btn-compact-primary">
            사이트 보기 →
          </a>
        `;

        modal.classList.add("is-open");
        modal.setAttribute("aria-hidden", "false");
        document.body.classList.add("modal-open");

        requestAnimationFrame(() => {
          document.getElementById("modal-close-btn").focus();
        });
      }

      function closeProjectModal() {
        const modal = document.getElementById("project-modal");
        if (!modal.classList.contains("is-open")) return;

        modal.classList.remove("is-open");
        modal.setAttribute("aria-hidden", "true");
        document.body.classList.remove("modal-open");
        state.selectedProjectId = null;

        if (state.lastFocusedElement && typeof state.lastFocusedElement.focus === "function") {
          state.lastFocusedElement.focus();
        }
      }

      /* ----------------------------------------------------------
         Clipboard & Toast
         ---------------------------------------------------------- */
      async function copyEmailToClipboard() {
        const email = PORTFOLIO_DATA.profile.email;
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(email);
          } else {
            const tempInput = document.createElement("textarea");
            tempInput.value = email;
            tempInput.setAttribute("readonly", "");
            tempInput.style.position = "absolute";
            tempInput.style.left = "-9999px";
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
          }
          showToast(`이메일 주소(${email})가 복사되었습니다.`);
        } catch (err) {
          showToast("복사에 실패했습니다. 메일 보내기 버튼을 이용해 주세요.");
        }
      }

      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.add("is-visible");

        if (state.toastTimer) {
          clearTimeout(state.toastTimer);
        }
        state.toastTimer = setTimeout(() => {
          toast.classList.remove("is-visible");
        }, 2600);
      }

      /* ----------------------------------------------------------
         Navigation & Global Event Wiring
         ---------------------------------------------------------- */
      function setupNavigation() {
        const toggleBtn = document.getElementById("mobile-menu-toggle");
        const toggleIcon = document.getElementById("mobile-menu-icon");
        const drawer = document.getElementById("mobile-drawer");
        const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        const closeDrawer = () => {
          drawer.classList.remove("is-open");
          toggleBtn.setAttribute("aria-expanded", "false");
          toggleBtn.setAttribute("aria-label", "메뉴 열기");
          toggleIcon.textContent = "☰";
        };

        toggleBtn.addEventListener("click", () => {
          const isOpen = drawer.classList.toggle("is-open");
          toggleBtn.setAttribute("aria-expanded", String(isOpen));
          toggleBtn.setAttribute("aria-label", isOpen ? "메뉴 닫기" : "메뉴 열기");
          toggleIcon.textContent = isOpen ? "✕" : "☰";
        });

        // Smooth scroll for all in-page anchor links
        document.querySelectorAll('a[href^="#"]').forEach((anchor) => {
          anchor.addEventListener("click", (event) => {
            const targetId = anchor.getAttribute("href").slice(1);
            if (!targetId) return;
            const targetEl = document.getElementById(targetId);
            if (!targetEl) return;

            event.preventDefault();
            closeDrawer();

            targetEl.scrollIntoView({
              behavior: prefersReducedMotion ? "auto" : "smooth",
              block: "start"
            });

            if (history.replaceState) {
              history.replaceState(null, "", `#${targetId}`);
            }
          });
        });

        // Scroll spy for top nav & mobile drawer links
        const sections = [
          { id: "about", el: document.getElementById("about") },
          { id: "works", el: document.getElementById("works") },
          { id: "contact", el: document.getElementById("contact") }
        ];
        const navItems = document.querySelectorAll("[data-nav]");

        const updateActiveNav = () => {
          const atBottom =
            window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 16;
          let activeId = "";

          if (atBottom) {
            activeId = "contact";
          } else {
            const scrollPos = window.scrollY + 150;
            for (const sec of sections) {
              if (sec.el && scrollPos >= sec.el.offsetTop) {
                activeId = sec.id;
              }
            }
          }

          navItems.forEach((link) => {
            link.classList.toggle("is-active", link.getAttribute("data-nav") === activeId);
          });
        };

        window.addEventListener("scroll", updateActiveNav, { passive: true });
        updateActiveNav();

        // Modal close bindings
        const modal = document.getElementById("project-modal");
        document.getElementById("modal-close-btn").addEventListener("click", closeProjectModal);
        modal.addEventListener("click", (event) => {
          if (event.target === modal) {
            closeProjectModal();
          }
        });

        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            closeProjectModal();
            closeDrawer();
          }
        });
      }

      document.addEventListener("DOMContentLoaded", () => {
        renderStaticContent();
        renderFilterBar();
        renderProjects();
        setupNavigation();
      });
    </script>
